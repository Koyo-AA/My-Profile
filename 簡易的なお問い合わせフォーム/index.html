<!DOCTYPE html>
<html lang="ja">
<head>

</head>
<body>

    <!-- ヘッダー -->
     <div class="container">
    <header>
        <h1>お問い合わせ</h1>
        <nav>
        </nav>

    <!-- メインコンテンツ -->
    <main>
        <section>
            <form action="#" method="#">

                <label for="name">
                    お名前 <span class="required">*</span>
                </label>
                <input type="text" id="name" name="name" required>

                <label for="email">
                    メールアドレス <span class="required">*</span>
                </label>
                <input type="email" id="email" name="email" required>

                <label for="phone">
                    電話番号 <span class="required">*</span>
                </label>
                <input type="phone" id="phone" name="phone" required>

                <label for="category">
                    題名
                </label>
                <input id="category" name="category"></textarea>

                <label for="message">お問い合わせ内容</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">
                    送信する
                </button>
            </form>
        </section>
    </main>
    </div>
    
    <!-- フッター -->
    <footer>

    </footer>
